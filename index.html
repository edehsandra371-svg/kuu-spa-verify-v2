<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuu Spa+ Product Verification</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

.container{
    max-width:500px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
    text-align:center;
}

img{
    width:200px;
    border-radius:10px;
}

input{
    width:100%;
    padding:12px;
    margin-top:15px;
    box-sizing:border-box;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    margin-top:15px;
    background:#b8860b;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

.success{
    background:#d4edda;
    color:#155724;
    padding:15px;
    border-radius:10px;
    margin-top:20px;
}

.error{
    background:#f8d7da;
    color:#721c24;
    padding:15px;
    border-radius:10px;
    margin-top:20px;
}

#status{
    margin-top:15px;
    font-size:14px;
    color:#555;
}
</style>
</head>

<body>

<div class="container">

<img src="file_00000000366081f49e0c1df82b188d4a.png" alt="Kuu Spa+">

<h1>Kuu Spa+ Product Verification</h1>

<p>Enter your serial number below.</p>

<input id="serial" placeholder="Example: KSP-B1-000001">

<button onclick="verifySerial()">Verify Product</button>

<div id="status">Loading serial database...</div>

<div id="result"></div>

</div>

<script>

let serialDatabase=[];

fetch("batch1_serials.json")
.then(response=>{
    if(!response.ok){
        throw new Error("Database not found");
    }
    return response.json();
})
.then(data=>{

    serialDatabase=data;

    document.getElementById("status").innerHTML=
    "✅ "+serialDatabase.length+" serial numbers loaded.";

})
.catch(error=>{

    document.getElementById("status").innerHTML=
    "❌ "+error.message;

    console.error(error);

});

function verifySerial(){

const code=document.getElementById("serial").value.trim().toUpperCase();

const result=document.getElementById("result");

if(serialDatabase.includes(code)){

result.innerHTML=
`<div class="success">
<h2>✅ AUTHENTIC PRODUCT</h2>
<p><strong>Kuu Spa+ Whitening Serum</strong></p>
<p>Serial Number:<br><strong>${code}</strong></p>
<p>This product is genuine.</p>
</div>`;

}else{

result.innerHTML=
`<div class="error">
<h2>❌ INVALID SERIAL NUMBER</h2>
<p>This serial number was not found.</p>
</div>`;

}

}

</script>

</body>
</html>

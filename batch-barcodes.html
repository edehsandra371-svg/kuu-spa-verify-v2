<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KUU SPA+ Batch Barcode Labels</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#fffdf5,#f4e7c2);
    color: #222;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 900px;
    margin: auto;
}

.control-card {
    background: white;
    border-radius: 24px;
    padding: 28px;
    box-shadow: 0 20px 50px rgba(70,50,10,0.15);
    margin-bottom: 25px;
}

.top-line {
    height: 4px;
    border-radius: 10px;
    margin-bottom: 25px;
    background: linear-gradient(
        90deg,
        #8f6700,
        #d4af37,
        #f2d675,
        #b8860b
    );
}

h1 {
    text-align: center;
    color: #9a7100;
    font-size: 28px;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #777;
    font-size: 14px;
    margin-bottom: 25px;
}

.controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.field label {
    display: block;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 7px;
}

.field input {
    width: 100%;
    padding: 14px;
    border: 2px solid #e1d7b9;
    border-radius: 11px;
    background: #fffdf8;
    font-size: 16px;
}

.generate-button,
.print-button,
.pdf-button {
    width: 100%;
    margin-top: 15px;
    padding: 15px;
    border: none;
    border-radius: 12px;
    color: white;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
}

.generate-button {
    background: linear-gradient(135deg,#b8860b,#d4af37);
}

.print-button {
    background: #222;
}

.pdf-button {
    background: linear-gradient(135deg,#7b1f1f,#a83232);
}

.quick-ranges {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 18px;
}

.range-button {
    padding: 9px 12px;
    border: 1px solid #d4af37;
    border-radius: 9px;
    background: white;
    color: #8f6700;
    font-size: 12px;
    font-weight: 700;
}

.message {
    min-height: 20px;
    margin-top: 15px;
    text-align: center;
    color: #666;
    font-size: 13px;
}

#printArea {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 10px;
    background: white;
    padding: 15px;
    border-radius: 15px;
}

.label {
    background: white;
    border: 1px solid #d9d9d9;
    border-radius: 6px;
    min-height: 150px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.label-brand {
    font-size: 11px;
    font-weight: 800;
    color: #9a7100;
    margin-bottom: 3px;
}

.label-product {
    font-size: 7px;
    color: #555;
    margin-bottom: 3px;
}

.barcode-svg {
    width: 100%;
    max-width: 175px;
}

.label-serial {
    margin-top: 3px;
    font-size: 9px;
    font-weight: 700;
}

.qr-preview {
    width: 35px;
    height: 35px;
    margin-top: 4px;
}

.qr-preview img,
.qr-preview canvas {
    width: 35px !important;
    height: 35px !important;
}

.label-verify {
    margin-top: 2px;
    font-size: 6px;
    color: #777;
}

.footer {
    text-align: center;
    margin-top: 25px;
    padding-top: 18px;
    border-top: 1px solid #eee7d5;
    color: #888;
    font-size: 12px;
    line-height: 1.6;
}

.footer strong {
    color: #9a7100;
}

@media(max-width:650px) {

    .controls {
        grid-template-columns: 1fr;
    }

    #printArea {
        grid-template-columns: repeat(2,1fr);
        gap: 8px;
        padding: 8px;
    }

    .control-card {
        padding: 22px 18px;
    }
}

@media print {

    @page {
        size: A4;
        margin: 8mm;
    }

    body {
        background: white;
        padding: 0;
    }

    .control-card,
    .footer {
        display: none !important;
    }

    #printArea {
        display: grid;
        grid-template-columns: repeat(3,1fr);
        gap: 4mm;
        padding: 0;
    }

    .label {
        min-height: 40mm;
        border: 0.3mm solid #ccc;
        break-inside: avoid;
        page-break-inside: avoid;
    }
}

</style>

</head>


<body>

<div class="container">


<section class="control-card">

<div class="top-line"></div>

<h1>KUU SPA+ Batch Barcode Labels</h1>

<p class="subtitle">
Production-ready barcode and QR code label generator
</p>


<div class="controls">

<div class="field">

<label for="startNumber">
Start Number
</label>

<input
id="startNumber"
type="number"
min="1"
max="2000"
value="1"
>

</div>


<div class="field">

<label for="endNumber">
End Number
</label>

<input
id="endNumber"
type="number"
min="1"
max="2000"
value="5"
>

</div>

</div>


<button
class="generate-button"
onclick="generateLabels()"
>
Generate Barcode Labels
</button>


<div class="quick-ranges">

<button class="range-button" onclick="setRange(1,100)">
1–100
</button>

<button class="range-button" onclick="setRange(101,200)">
101–200
</button>

<button class="range-button" onclick="setRange(201,300)">
201–300
</button>

<button class="range-button" onclick="setRange(301,400)">
301–400
</button>

<button class="range-button" onclick="setRange(401,500)">
401–500
</button>

<button class="range-button" onclick="setRange(501,1000)">
501–1000
</button>

<button class="range-button" onclick="setRange(1001,1500)">
1001–1500
</button>

<button class="range-button" onclick="setRange(1501,2000)">
1501–2000
</button>

</div>


<div id="message" class="message">
Select a range and generate labels.
</div>


<button
id="printButton"
class="print-button"
onclick="printLabels()"
style="display:none;"
>
🖨️ Print Labels
</button>


<button
id="pdfButton"
class="pdf-button"
onclick="exportPDF()"
style="display:none;"
>
📄 Export PDF
</button>


</section>


<section id="printArea">

<div class="label">

<div class="label-brand">
KUU SPA+
</div>

<div class="label-product">
Turmeric Whitening Serum
</div>

</div>

</section>


<div class="footer">

KUU SPA+ Batch Barcode System<br>

Powered by
<strong>Daisy Creative Studio</strong>

</div>


</div>



<script>

const startInput =
document.getElementById("startNumber");

const endInput =
document.getElementById("endNumber");

const printArea =
document.getElementById("printArea");

const message =
document.getElementById("message");

const printButton =
document.getElementById("printButton");

const pdfButton =
document.getElementById("pdfButton");


const verificationURL =
"https://edehsandra371-svg.github.io/kuu-spa-verify-v2/";


let currentStart = 0;

let currentEnd = 0;


function setRange(start,end) {

    startInput.value = start;

    endInput.value = end;

    generateLabels();

}


function generateLabels() {

    const start =
        parseInt(startInput.value,10);

    const end =
        parseInt(endInput.value,10);

    printArea.innerHTML = "";

    printButton.style.display = "none";

    pdfButton.style.display = "none";


    if (
        Number.isNaN(start) ||
        Number.isNaN(end)
    ) {

        showMessage(
            "Please enter a valid range."
        );

        return;
    }


    if (
        start < 1 ||
        end > 2000
    ) {

        showMessage(
            "Batch B1 contains serial numbers 1–2000."
        );

        return;
    }


    if (start > end) {

        showMessage(
            "Start number cannot be greater than end number."
        );

        return;
    }


    const total =
        end - start + 1;


    if (total > 500) {

        showMessage(
            "Please generate a maximum of 500 labels at a time."
        );

        return;
    }


    currentStart = start;

    currentEnd = end;


    showMessage(
        "Generating " +
        total +
        " labels..."
    );


    for (
        let number = start;
        number <= end;
        number++
    ) {

        const serial =
            "KSP-B1-" +
            String(number).padStart(6,"0");

        createLabel(serial);

    }


    showMessage(
        "✅ " +
        total +
        " barcode and QR labels generated."
    );


    printButton.style.display = "block";

    pdfButton.style.display = "block";

}


function createLabel(serial) {

    const label =
        document.createElement("div");

    label.className = "label";


    const brand =
        document.createElement("div");

    brand.className = "label-brand";

    brand.textContent =
        "KUU SPA+";


    const product =
        document.createElement("div");

    product.className =
        "label-product";

    product.textContent =
        "Turmeric Whitening Serum";


    const svg =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "svg"
        );

    svg.classList.add(
        "barcode-svg"
    );


    const serialText =
        document.createElement("div");

    serialText.className =
        "label-serial";

    serialText.textContent =
        serial;


    const qrBox =
        document.createElement("div");

    qrBox.className =
        "qr-preview";


    const verifyText =
        document.createElement("div");

    verifyText.className =
        "label-verify";

    verifyText.textContent =
        "Scan to verify authenticity";


    label.appendChild(brand);

    label.appendChild(product);

    label.appendChild(svg);

    label.appendChild(serialText);

    label.appendChild(qrBox);

    label.appendChild(verifyText);

    printArea.appendChild(label);


    try {

        JsBarcode(
            svg,
            serial,
            {
                format: "CODE128",
                width: 1.3,
                height: 42,
                displayValue: false,
                margin: 2
            }
        );

    } catch(error) {

        console.error(
            "Barcode error:",
            error
        );

    }


    try {

        new QRCode(
            qrBox,
            {
                text:
                    verificationURL +
                    "?serial=" +
                    encodeURIComponent(serial),

                width: 35,

                height: 35,

                correctLevel:
                    QRCode.CorrectLevel.M
            }
        );

    } catch(error) {

        console.error(
            "QR error:",
            error
        );

    }

}


function showMessage(text) {

    message.textContent = text;

}


function printLabels() {

    if (currentStart === 0) {

        showMessage(
            "Please generate labels first."
        );

        return;
    }

    window.print();

}


async function exportPDF() {

    if (currentStart === 0) {

        showMessage(
            "Please generate labels first."
        );

        return;
    }


    if (
        typeof window.jspdf ===
        "undefined"
    ) {

        showMessage(
            "❌ PDF library could not load."
        );

        return;
    }


    showMessage(
        "Preparing production PDF..."
    );


    try {

        const { jsPDF } =
            window.jspdf;


        const pdf =
            new jsPDF({
                orientation: "portrait",
                unit: "mm",
                format: "a4"
            });


        const pageWidth = 210;

        const pageHeight = 297;


        const columns = 3;

        const rows = 6;


        const marginX = 8;

        const marginY = 8;

        const gapX = 3;

        const gapY = 3;


        const labelWidth =
            (
                pageWidth -
                marginX * 2 -
                gapX * (columns - 1)
            ) / columns;


        const labelHeight =
            (
                pageHeight -
                marginY * 2 -
                gapY * (rows - 1)
            ) / rows;


        let labelIndex = 0;


        for (
            let number = currentStart;
            number <= currentEnd;
            number++
        ) {


            if (
                labelIndex > 0 &&
                labelIndex %
                (columns * rows) === 0
            ) {

                pdf.addPage();

            }


            const position =
                labelIndex %
                (columns * rows);


            const column =
                position % columns;


            const row =
                Math.floor(
                    position / columns
                );


            const x =
                marginX +
                column *
                (labelWidth + gapX);


            const y =
                marginY +
                row *
                (labelHeight + gapY);


            const serial =
                "KSP-B1-" +
                String(number).padStart(6,"0");


            /* Label border */

            pdf.setDrawColor(
                210,210,210
            );

            pdf.rect(
                x,
                y,
                labelWidth,
                labelHeight
            );


            /* Brand */

            pdf.setFont(
                "helvetica",
                "bold"
            );

            pdf.setFontSize(9);

            pdf.text(
                "KUU SPA+",
                x + labelWidth / 2,
                y + 6,
                {align:"center"}
            );


            /* Product */

            pdf.setFont(
                "helvetica",
                "normal"
            );

            pdf.setFontSize(5.5);

            pdf.text(
                "Turmeric Whitening Serum",
                x + labelWidth / 2,
                y + 10,
                {align:"center"}
            );


            /* Barcode */

            const barcodeCanvas =
                document.createElement(
                    "canvas"
                );


            JsBarcode(
                barcodeCanvas,
                serial,
                {
                    format:"CODE128",
                    width:2,
                    height:45,
                    displayValue:false,
                    margin:0
                }
            );


            pdf.addImage(
                barcodeCanvas.toDataURL(
                    "image/png"
                ),
                "PNG",
                x + 3,
                y + 12,
                labelWidth - 6,
                16
            );


            /* Serial */

            pdf.setFont(
                "helvetica",
                "bold"
            );

            pdf.setFontSize(7);

            pdf.text(
                serial,
                x + labelWidth / 2,
                y + 31,
                {align:"center"}
            );


            /* QR */

            const qrCanvas =
                document.createElement(
                    "canvas"
                );


            await createQRCanvas(
                verificationURL +
                "?serial=" +
                encodeURIComponent(serial),
                qrCanvas
            );


            const qrSize = 11;


            pdf.addImage(
                qrCanvas.toDataURL(
                    "image/png"
                ),
                "PNG",
                x +
                labelWidth / 2 -
                qrSize / 2,
                y + 33,
                qrSize,
                qrSize
            );


            /* Verify text */

            pdf.setFont(
                "helvetica",
                "normal"
            );

            pdf.setFontSize(4.5);

            pdf.text(
                "Scan to verify authenticity",
                x + labelWidth / 2,
                y + 47,
                {align:"center"}
            );


            labelIndex++;

        }


        const filename =
            "KUU-SPA-B1-QR-Labels-" +
            String(currentStart).padStart(6,"0") +
            "-" +
            String(currentEnd).padStart(6,"0") +
            ".pdf";


        pdf.save(filename);


        showMessage(
            "✅ PDF created successfully: " +
            filename
        );


    } catch(error) {

        console.error(
            "PDF error:",
            error
        );

        showMessage(
            "❌ PDF creation failed. Please try again."
        );

    }

}


/*
Create a QR code on a temporary
canvas using the QRCode library.
*/

function createQRCanvas(
    text,
    canvas
) {

    return new Promise(
        function(resolve,reject) {

            const holder =
                document.createElement(
                    "div"
                );


            holder.style.position =
                "absolute";

            holder.style.left =
                "-9999px";


            document.body.appendChild(
                holder
            );


            try {

                new QRCode(
                    holder,
                    {
                        text:text,
                        width:100,
                        height:100,
                        correctLevel:
                            QRCode.CorrectLevel.M
                    }
                );


                setTimeout(
                    function() {

                        const source =
                            holder.querySelector(
                                "canvas"
                            );


                        if (!source) {

                            holder.remove();

                            reject(
                                "QR canvas not created"
                            );

                            return;

                        }


                        canvas.width =
                            source.width;

                        canvas.height =
                            source.height;


                        const context =
                            canvas.getContext(
                                "2d"
                            );


                        context.drawImage(
                            source,
                            0,
                            0
                        );


                        holder.remove();

                        resolve();

                    },
                    100
                );


            } catch(error) {

                holder.remove();

                reject(error);

            }

        }
    );

}

</script>

</body>
</html>

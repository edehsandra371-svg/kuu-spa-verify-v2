<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KUU SPA+ Batch Barcode Labels</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #fffdf5, #f4e7c2);
    color: #222;
    padding: 20px;
}

.container {
    max-width: 900px;
    margin: auto;
}

.control-card {
    background: white;
    border-radius: 22px;
    padding: 25px;
    box-shadow: 0 15px 40px rgba(70,50,10,0.15);
    margin-bottom: 25px;
}

.top-line {
    height: 4px;
    border-radius: 10px;
    margin-bottom: 20px;
    background: linear-gradient(
        90deg,
        #8f6700,
        #d4af37,
        #f2d675,
        #b8860b
    );
}

h1 {
    text-align: center;
    color: #9a7100;
    font-size: 27px;
    margin: 0 0 8px;
}

.subtitle {
    text-align: center;
    color: #777;
    font-size: 14px;
    margin-bottom: 22px;
}

.controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.field label {
    display: block;
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 7px;
}

.field input {
    width: 100%;
    padding: 14px;
    border: 2px solid #e1d7b9;
    border-radius: 10px;
    font-size: 16px;
}

button {
    cursor: pointer;
}

.generate-button,
.print-button,
.pdf-button {
    width: 100%;
    margin-top: 15px;
    padding: 15px;
    border: none;
    border-radius: 11px;
    color: white;
    font-size: 15px;
    font-weight: bold;
}

.generate-button {
    background: linear-gradient(135deg,#b8860b,#d4af37);
}

.print-button {
    background: #222;
}

.pdf-button {
    background: #9b3030;
}

.quick-ranges {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 18px;
}

.range-button {
    padding: 9px 12px;
    border: 1px solid #d4af37;
    border-radius: 9px;
    background: white;
    color: #8f6700;
    font-size: 12px;
    font-weight: bold;
}

.message {
    min-height: 20px;
    margin-top: 15px;
    text-align: center;
    color: #666;
    font-size: 13px;
}

#printArea {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    background: white;
    padding: 12px;
    border-radius: 15px;
}

.label {
    background: white;
    border: 1px solid #d5d5d5;
    border-radius: 5px;
    min-height: 150px;
    padding: 7px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
}

.label-brand {
    font-size: 11px;
    font-weight: bold;
    color: #9a7100;
    margin-bottom: 2px;
}

.label-product {
    font-size: 7px;
    color: #555;
    margin-bottom: 2px;
}

.barcode-svg {
    width: 100%;
    max-width: 175px;
}

.label-serial {
    margin-top: 2px;
    font-size: 9px;
    font-weight: bold;
}

.qr-preview {
    width: 32px;
    height: 32px;
    margin-top: 3px;
}

.qr-preview img,
.qr-preview canvas {
    width: 32px !important;
    height: 32px !important;
}

.label-verify {
    margin-top: 2px;
    font-size: 6px;
    color: #777;
}

.footer {
    text-align: center;
    margin-top: 22px;
    padding-top: 15px;
    border-top: 1px solid #eee7d5;
    color: #888;
    font-size: 12px;
    line-height: 1.6;
}

.footer strong {
    color: #9a7100;
}

@media(max-width:650px) {

    .controls {
        grid-template-columns: 1fr;
    }

    #printArea {
        grid-template-columns: repeat(2,1fr);
    }

}

@media print {

    @page {
        size: A4;
        margin: 8mm;
    }

    body {
        background: white;
        padding: 0;
    }

    .control-card,
    .footer {
        display: none !important;
    }

    #printArea {
        display: grid;
        grid-template-columns: repeat(3,1fr);
        gap: 3mm;
        padding: 0;
    }

    .label {
        min-height: 40mm;
        height: 40mm;
        border: 0.3mm solid #ccc;
        padding: 2mm;
        break-inside: avoid;
        page-break-inside: avoid;
    }

}

</style>
</head>

<body>

<div class="container">

<section class="control-card">

<div class="top-line"></div>

<h1>KUU SPA+ Batch Barcode Labels</h1>

<p class="subtitle">
Production-ready barcode and QR code label generator
</p>

<div class="controls">

<div class="field">
<label for="startNumber">Start Number</label>

<input
id="startNumber"
type="number"
min="1"
max="2000"
value="1">
</div>

<div class="field">
<label for="endNumber">End Number</label>

<input
id="endNumber"
type="number"
min="1"
max="2000"
value="5">
</div>

</div>

<button
class="generate-button"
onclick="generateLabels()">
Generate Barcode Labels
</button>

<div class="quick-ranges">

<button class="range-button" onclick="setRange(1,100)">
1–100
</button>

<button class="range-button" onclick="setRange(101,200)">
101–200
</button>

<button class="range-button" onclick="setRange(201,300)">
201–300
</button>

<button class="range-button" onclick="setRange(301,400)">
301–400
</button>

<button class="range-button" onclick="setRange(401,500)">
401–500
</button>

<button class="range-button" onclick="setRange(501,1000)">
501–1000
</button>

<button class="range-button" onclick="setRange(1001,1500)">
1001–1500
</button>

<button class="range-button" onclick="setRange(1501,2000)">
1501–2000
</button>

</div>

<div id="message" class="message">
Select a range and generate labels.
</div>

<button
id="printButton"
class="print-button"
onclick="printLabels()"
style="display:none;">
🖨️ Print Labels
</button>

<button
id="pdfButton"
class="pdf-button"
onclick="exportPDF()"
style="display:none;">
📄 Export PDF
</button>

</section>

<section id="printArea"></section>

<div class="footer">
KUU SPA+ Batch Barcode System<br>
Powered by <strong>Daisy Creative Studio</strong>
</div>

</div>

<script>

const startInput =
document.getElementById("startNumber");

const endInput =
document.getElementById("endNumber");

const printArea =
document.getElementById("printArea");

const message =
document.getElementById("message");

const printButton =
document.getElementById("printButton");

const pdfButton =
document.getElementById("pdfButton");

const verificationURL =
"https://edehsandra371-svg.github.io/kuu-spa-verify-v2/";

let currentStart = 0;
let currentEnd = 0;


function setRange(start, end) {

    startInput.value = start;
    endInput.value = end;

    generateLabels();

}


function generateLabels() {

    const start =
    parseInt(startInput.value, 10);

    const end =
    parseInt(endInput.value, 10);

    printArea.innerHTML = "";

    printButton.style.display = "none";
    pdfButton.style.display = "none";


    if (
        Number.isNaN(start) ||
        Number.isNaN(end)
    ) {

        showMessage(
            "Please enter a valid range."
        );

        return;
    }


    if (
        start < 1 ||
        end > 2000
    ) {

        showMessage(
            "Batch B1 contains serial numbers 1–2000."
        );

        return;
    }


    if (start > end) {

        showMessage(
            "Start number cannot be greater than end number."
        );

        return;
    }


    const total =
    end - start + 1;


    if (total > 500) {

        showMessage(
            "Please generate a maximum of 500 labels at a time."
        );

        return;
    }


    currentStart = start;
    currentEnd = end;


    for (
        let number = start;
        number <= end;
        number++
    ) {

        const serial =
        "KSP-B1-" +
        String(number).padStart(6, "0");

        createLabel(serial);

    }


    showMessage(
        "✅ " +
        total +
        " barcode and QR labels generated."
    );


    printButton.style.display = "block";
    pdfButton.style.display = "block";

}


function createLabel(serial) {

    const label =
    document.createElement("div");

    label.className = "label";


    const brand =
    document.createElement("div");

    brand.className = "label-brand";
    brand.textContent = "KUU SPA+";


    const product =
    document.createElement("div");

    product.className = "label-product";
    product.textContent =
    "Turmeric Whitening Serum";


    const svg =
    document.createElementNS(
        "http://www.w3.org/2000/svg",
        "svg"
    );

    svg.classList.add("barcode-svg");


    const serialText =
    document.createElement("div");

    serialText.className = "label-serial";
    serialText.textContent = serial;


    const qrBox =
    document.createElement("div");

    qrBox.className = "qr-preview";


    const verifyText =
    document.createElement("div");

    verifyText.className = "label-verify";
    verifyText.textContent =
    "Scan to verify authenticity";


    label.appendChild(brand);
    label.appendChild(product);
    label.appendChild(svg);
    label.appendChild(serialText);
    label.appendChild(qrBox);
    label.appendChild(verifyText);

    printArea.appendChild(label);


    JsBarcode(
        svg,
        serial,
        {
            format: "CODE128",
            width: 1.3,
            height: 38,
            displayValue: false,
            margin: 1
        }
    );


    new QRCode(
        qrBox,
        {
            text:
            verificationURL +
            "?serial=" +
            encodeURIComponent(serial),

            width: 32,
            height: 32,

            correctLevel:
            QRCode.CorrectLevel.M
        }
    );

}


function showMessage(text) {

    message.textContent = text;

}


function printLabels() {

    if (currentStart === 0) {

        showMessage(
            "Please generate labels first."
        );

        return;
    }

    window.print();

}


async function exportPDF() {

    if (currentStart === 0) {

        showMessage(
            "Please generate labels first."
        );

        return;
    }


    if (!window.jspdf) {

        showMessage(
            "❌ PDF library could not load."
        );

        return;
    }


    showMessage(
        "Preparing production PDF..."
    );


    try {

        const { jsPDF } = window.jspdf;


        const pdf =
        new jsPDF({
            orientation: "portrait",
            unit: "mm",
            format: "a4"
        });


        const pageWidth = 210;
        const pageHeight = 297;


        const columns = 3;
        const rows = 6;


        const marginX = 8;
        const marginY = 8;


        const gapX = 3;
        const gapY = 3;


        const labelWidth =
        (
            pageWidth -
            marginX * 2 -
            gapX * (columns - 1)
        ) / columns;


        const labelHeight =
        (
            pageHeight -
            marginY * 2 -
            gapY * (rows - 1)
        ) / rows;


        let labelIndex = 0;


        for (
            let number = currentStart;
            number <= currentEnd;
            number++
        ) {


            if (
                labelIndex > 0 &&
                labelIndex % 18 === 0
            ) {

                pdf.addPage();

            }


            const position =
            labelIndex % 18;


            const column =
            position % columns;


            const row =
            Math.floor(position / columns);


            const x =
            marginX +
            column *
            (labelWidth + gapX);


            const y =
            marginY +
            row *
            (labelHeight + gapY);


            const serial =
            "KSP-B1-" +
            String(number).padStart(6, "0");


            /*
            LABEL BORDER
            */

            pdf.setDrawColor(
                210,
                210,
                210
            );

            pdf.rect(
                x,
                y,
                labelWidth,
                labelHeight
            );


            /*
            BRAND
            */

            pdf.setFont(
                "helvetica",
                "bold"
            );

            pdf.setFontSize(8);

            pdf.text(
                "KUU SPA+",
                x + labelWidth / 2,
                y + 5,
                {
                    align: "center"
                }
            );


            /*
            PRODUCT
            */

            pdf.setFont(
                "helvetica",
                "normal"
            );

            pdf.setFontSize(5);

            pdf.text(
                "Turmeric Whitening Serum",
                x + labelWidth / 2,
                y + 8,
                {
                    align: "center"
                }
            );


            /*
            BARCODE
            */

            const barcodeCanvas =
            document.createElement("canvas");


            JsBarcode(
                barcodeCanvas,
                serial,
                {
                    format: "CODE128",
                    width: 2,
                    height: 40,
                    displayValue: false,
                    margin: 0
                }
            );


            pdf.addImage(
                barcodeCanvas.toDataURL("image/png"),
                "PNG",
                x + 3,
                y + 10,
                labelWidth - 6,
                13
            );


            /*
            SERIAL NUMBER
            */

            pdf.setFont(
                "helvetica",
                "bold"
            );

            pdf.setFontSize(6.5);

            pdf.text(
                serial,
                x + labelWidth / 2,
                y + 27,
                {
                    align: "center"
                }
            );


            /*
            QR CODE
            */

            const qrCanvas =
            await makeQRCanvas(
                verificationURL +
                "?serial=" +
                encodeURIComponent(serial)
            );


            const qrSize = 9;


            pdf.addImage(
                qrCanvas.toDataURL("image/png"),
                "PNG",
                x + labelWidth / 2 - qrSize / 2,
                y + 29,
                qrSize,
                qrSize
            );


            /*
            VERIFICATION TEXT
            */

            pdf.setFont(
                "helvetica",
                "normal"
            );

            pdf.setFontSize(4);

            pdf.text(
                "Scan to verify authenticity",
                x + labelWidth / 2,
                y + 39.5,
                {
                    align: "center"
                }
            );


            labelIndex++;

        }


        const filename =
        "KUU-SPA-B1-QR-Labels-" +
        String(currentStart).padStart(6, "0") +
        "-" +
        String(currentEnd).padStart(6, "0") +
        ".pdf";


        pdf.save(filename);


        showMessage(
            "✅ PDF created successfully: " +
            filename
        );


    } catch(error) {

        console.error(error);

        showMessage(
            "❌ PDF creation failed. Please try again."
        );

    }

}


function makeQRCanvas(text) {

    return new Promise(
        function(resolve, reject) {

            const holder =
            document.createElement("div");


            holder.style.position =
            "absolute";

            holder.style.left =
            "-9999px";


            document.body.appendChild(
                holder
            );


            try {

                new QRCode(
                    holder,
                    {
                        text: text,
                        width: 100,
                        height: 100,
                        correctLevel:
                        QRCode.CorrectLevel.M
                    }
                );


                setTimeout(
                    function() {

                        const canvas =
                        holder.querySelector(
                            "canvas"
                        );


                        if (!canvas) {

                            holder.remove();

                            reject(
                                "QR code failed"
                            );

                            return;
                        }


                        const copy =
                        document.createElement(
                            "canvas"
                        );


                        copy.width =
                        canvas.width;

                        copy.height =
                        canvas.height;


                        const context =
                        copy.getContext("2d");


                        context.drawImage(
                            canvas,
                            0,
                            0
                        );


                        holder.remove();

                        resolve(copy);

                    },
                    100
                );


            } catch(error) {

                holder.remove();

                reject(error);

            }

        }
    );

}

</script>

</body>
    </html>

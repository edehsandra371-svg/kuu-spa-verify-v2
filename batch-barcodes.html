<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KUU SPA+ Batch B1 Barcode Labels</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:20px;
}

h1{
    text-align:center;
    color:#b8860b;
}

#labels{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:20px;
}

.label{
    background:#fff;
    border:1px solid #ccc;
    border-radius:10px;
    padding:15px;
    text-align:center;
    page-break-inside:avoid;
}

.brand{
    font-size:18px;
    font-weight:bold;
    color:#b8860b;
}

.serial{
    margin-top:10px;
    font-weight:bold;
}

@media print{
    body{
        background:white;
    }

    .label{
        box-shadow:none;
    }
}
</style>

</head>

<body>

<h1>KUU SPA+ Batch B1 Barcode Labels</h1>
    
<div style="text-align:center;margin:20px 0;">
    <button onclick="window.print()"
        style="background:#b8860b;color:white;
        border:none;padding:12px 24px;
        font-size:18px;border-radius:8px;cursor:pointer;">
        🖨️ Print Labels
    </button>
</div>

<div id="labels"></div>


<script>

fetch("batch1_serials.json")
.then(r=>r.json())
.then(serials=>{

const container=document.getElementById("labels");

serials.forEach((serial,index)=>{

const box=document.createElement("div");

box.className="label";

box.innerHTML=`
<div class="brand">KUU SPA+</div>

<svg id="barcode${index}"></svg>

<div class="serial">${serial}</div>
`;

container.appendChild(box);

JsBarcode(
`#barcode${index}`,
serial,
{
format:"CODE128",
displayValue:false,
height:60,
width:2,
margin:10
}
);

});

});

</script>

</body>
</html>
